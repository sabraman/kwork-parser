name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: shellcheck deploy/deploy-kwork-parser
      - run: deploy/test-deploy-kwork-parser

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - run: cargo test --locked

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          key: x86_64-unknown-linux-musl
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build static Linux binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Prepare release artifact
        run: |
          install -D -m 0755 target/x86_64-unknown-linux-musl/release/kwork-parser dist/kwork-parser
          (cd dist && sha256sum kwork-parser > kwork-parser.sha256)
          printf '%s\n' "$GITHUB_SHA" > dist/commit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kwork-parser-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, msrv, release]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: kwork-parser-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kwork-parser-linux-x86_64
          path: dist
      - name: Configure production SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/deploy_key"
      - name: Deploy and verify
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          stage="/var/lib/kwork-deploy/uploads/$GITHUB_SHA"
          common_options=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote="$VPS_USER@$VPS_HOST"

          cleanup() {
            ssh "${common_options[@]}" -p "$VPS_PORT" "$remote" "test ! -d '$stage' || rm -rf -- '$stage'" || true
          }
          trap cleanup EXIT

          ssh "${common_options[@]}" -p "$VPS_PORT" "$remote" "install -d -m 0700 '$stage'"
          scp "${common_options[@]}" -P "$VPS_PORT" dist/kwork-parser dist/kwork-parser.sha256 dist/commit "$remote:$stage/"
          ssh "${common_options[@]}" -p "$VPS_PORT" "$remote" "sudo /usr/local/sbin/deploy-kwork-parser '$stage'"
